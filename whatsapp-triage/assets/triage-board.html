  --ring1:inset 0 0 0 1px rgba(255,255,255,.08);
  --glasstop:rgba(255,255,255,.14);
  --glassring:inset 0 1px 0 rgba(255,255,255,.14), inset 0 0 0 1px rgba(255,255,255,.12);
  --glassdrop:0 30px 60px -26px rgba(0,0,0,.92);

  }
}
:root[data-theme="dark"] {
  --ink:#eef1f5;
  --ink2:#c4cad3;
  --muted:#8b929c;
  --faint:#5b626c;
  --line:rgba(255,255,255,.08);
  --hair:rgba(255,255,255,.055);
  --accent-ink:#ffb680;
  --accent-soft:rgba(255,122,31,.13);
  --accent-ring:rgba(255,146,72,.4);
  --accent-fill:linear-gradient(150deg,rgba(255,122,31,.22),rgba(255,122,31,.07));
  --st-ns:#8b929c;
  --st-ns-bg:rgba(255,255,255,.05);

:root {
  --ease:cubic-bezier(.32,.72,0,1);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --accent:#ff7a1f;
}
* { box-sizing:border-box; }
html,body { height:100dvh; }
body {
  margin:0; color:var(--ink); font-family:var(--font); font-size:13.5px;
  -webkit-font-smoothing:var(--smooth); overflow:hidden;
  display:grid; grid-template-rows:auto auto 1fr;
  background:var(--bgimage);
  background-attachment:fixed;
}
:focus-visible { outline:1px solid var(--accent-ink); outline-offset:2px; }
::-webkit-scrollbar { width:9px; height:9px; }
::-webkit-scrollbar-thumb { background:var(--scroll); border-radius:999px; }
::-webkit-scrollbar-track { background:transparent; }

/* ===== 顶栏 (Deck .bar) ===== */
.bar { display:flex; align-items:center; gap:12px; height:50px; padding:0 22px;
  background:var(--barbg); -webkit-backdrop-filter:blur(22px) saturate(var(--sat));
  backdrop-filter:blur(22px) saturate(var(--sat)); border-bottom:1px solid var(--line); }
.bar h1 { margin:0; font-size:15px; font-weight:650; letter-spacing:-.01em; }
.bar .tag { font-size:10px; font-weight:600; color:var(--muted); letter-spacing:.03em; }
.bar .sp { flex:1; }
.bar .kv { font-size:11px; color:var(--muted); }
.bar .kv b { color:var(--ink2); font-weight:600; }
.bar .kv.hot b { color:var(--accent-ink); }

/* ===== 缺口条 ===== */
.gapstrip { background:var(--st-bl-bg); border-bottom:1px solid var(--st-bl-bg);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
.gaphead { display:flex; align-items:center; gap:11px; width:100%; padding:8px 22px;
  background:none; border:0; cursor:pointer; text-align:left; font:inherit; color:inherit;
  transition:background .15s var(--ease); }
.gaphead:hover { background:var(--hover); }
.gaphead .mark { font-size:9.5px; font-weight:700; letter-spacing:.06em; color:var(--st-bl);
  background:var(--st-bl-bg); padding:3px 8px; border-radius:999px;
  box-shadow:inset 0 0 0 1px var(--st-bl); }
.gaphead h4 { margin:0; font-size:12px; font-weight:650; color:var(--warn-head); }
.gaphead .lead { font-size:11.5px; color:var(--muted); }
.gaphead .chev { margin-left:auto; font-size:10.5px; color:var(--muted); }
.gapbody { display:none; padding:0 22px 14px 52px; }
.gapstrip.open .gapbody { display:block; }
.gapbody ul { margin:0 0 10px; padding-left:16px; columns:2; column-gap:32px; }
.gapbody li { font-size:11.5px; line-height:1.85; color:var(--ink2); break-inside:avoid; }
.gapbody p { margin:0; padding-top:9px; border-top:1px solid var(--hair);
  font-size:11px; line-height:1.8; color:var(--muted); }

/* ===== 骨架 ===== */
.shell { display:grid; grid-template-columns:376px 1fr; min-height:0; }

/* ===== 左栏 ===== */
.list { overflow-y:auto; padding:4px 12px 16px; border-right:1px solid var(--line); }
.sect { margin-top:16px; padding:0 4px 9px; font-size:10.5px; color:var(--muted);
  text-transform:uppercase; letter-spacing:.08em; font-weight:700;
  display:flex; align-items:center; gap:7px; }
.sect i { font-style:normal; font-size:9.5px; color:var(--faint); letter-spacing:0; }
.item { display:block; width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit;
  background:var(--panel); border:0; border-radius:10px; padding:10px 12px; margin-bottom:7px;
  box-shadow:var(--ring1);
  transition:box-shadow .16s var(--ease), background .16s var(--ease); }
.item:hover { background:var(--hover); box-shadow:var(--glassring); }
.item.dim { background:var(--panel2); opacity:.62; padding:8px 12px; }
.item.dim:hover { opacity:1; }
.item.is-on { background:var(--glass-sel);
  -webkit-backdrop-filter:blur(30px) saturate(var(--sat)); backdrop-filter:blur(30px) saturate(var(--sat));
  box-shadow:var(--glassring), var(--glassdrop); opacity:1; }
.item.p1.is-on { box-shadow:inset 0 1px 0 var(--glasstop),
  inset 0 0 0 1px var(--accent-ring), var(--glassdrop); }
.i-head { display:flex; align-items:center; gap:7px; }
.pill { display:inline-block; flex:none; font-size:10.5px; font-weight:600; padding:1px 8px;
  border-radius:999px; white-space:nowrap; }
.t1 { background:var(--accent-fill);
  box-shadow:inset 0 0 0 1px var(--accent-ring); color:var(--accent-ink); }
.t2 { background:var(--st-wf-bg); box-shadow:inset 0 0 0 1px var(--st-wf); color:var(--st-wf); }
.t3 { background:var(--st-ns-bg); box-shadow:inset 0 0 0 1px var(--line); color:var(--st-ns); }
.i-emo { flex:none; font-size:12px; }
.i-name { flex:1; min-width:0; font-size:13px; font-weight:600; line-height:1.35; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item.dim .i-name { font-weight:500; color:var(--ink2); }
.sq { flex:none; width:6px; height:6px; border-radius:50%; background:var(--st-bl);
  box-shadow:0 0 7px 1px var(--st-bl-bg); }
.i-num { flex:none; font-size:9.5px; font-weight:600; color:var(--faint);
  font-variant-numeric:tabular-nums; }
.snip { margin-top:6px; font-size:11.5px; line-height:1.5; color:var(--ink2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item.p1 .snip { color:var(--accent-ink); }
.i-foot { display:flex; align-items:center; gap:7px; margin-top:7px; }
.ball { font-size:9.5px; font-weight:600; padding:1px 7px; border-radius:999px; }
.bme { background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent-ring);
  color:var(--accent-ink); }
.bthem { background:var(--st-ns-bg); box-shadow:var(--ring1);
  color:var(--muted); }
.i-date { font-size:9.5px; color:var(--faint); font-variant-numeric:tabular-nums; }
.legend { margin-top:14px; padding:10px 12px; border-radius:10px; background:var(--panel2);
  box-shadow:var(--ring1);
  font-size:10.5px; line-height:1.9; color:var(--muted); }
kbd { font-size:9.5px; font-weight:600; color:var(--ink2); padding:1px 5px; border-radius:5px;
  box-shadow:var(--ring1); }

/* ===== 右栏: 一屏看完 ===== */
.stage { min-height:0; padding:14px 18px 18px; display:flex; }
.panel { display:none; }
.panel.is-on { display:grid; grid-template-rows:auto 1fr; gap:12px; width:100%; min-height:0; }

.glass { background:var(--glass); border-radius:14px;
  -webkit-backdrop-filter:blur(30px) saturate(var(--sat)); backdrop-filter:blur(30px) saturate(var(--sat));
  box-shadow:var(--glassring), var(--glassdrop); }
.phead { padding:14px 18px 0; overflow:hidden; }
.ph-l { display:flex; align-items:center; gap:10px; padding-bottom:13px; }
.pill.big { font-size:11px; padding:3px 11px; }
.ptitle { margin:0; font-size:19px; font-weight:650; letter-spacing:-.01em; }
.gauges { display:flex; flex-wrap:wrap; margin:0 -18px; border-top:1px solid var(--hair);
  background:var(--panel2); }
.gauge { flex:0 0 auto; min-width:96px; padding:8px 16px; border-right:1px solid var(--hair); }
.gauge.grow { flex:1 1 190px; min-width:0; }
.gauge:last-child { border-right:0; }
.gauge span { display:block; font-size:9px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--faint); }
.gauge b { display:block; margin-top:4px; font-size:12px; font-weight:600; color:var(--ink2);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.gauge b.hot { color:var(--accent-ink); }

.grid { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.04fr); gap:12px; min-height:0; }
.col { display:grid; grid-template-rows:auto minmax(0,1fr); gap:12px; min-height:0; }
.col:last-child { grid-template-rows:minmax(0,1fr); }

.mod { display:flex; flex-direction:column; min-height:0; overflow:hidden; }
.mod-head { flex:none; display:flex; align-items:center; gap:8px; padding:11px 16px 9px;
  border-bottom:1px solid var(--hair); }
.mod-head h4 { margin:0; font-size:10.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); }
.mod-c { margin-left:auto; font-size:10px; color:var(--faint); }
.mod-body { padding:14px 16px 16px; min-height:0; }
.mod-body.scroll { overflow-y:auto; }
.prose { margin:0; font-size:14px; line-height:1.9; color:var(--ink); }
.warnbox { margin-top:13px; background:var(--st-bl-bg); border-radius:10px; padding:10px 13px;
  box-shadow:inset 0 0 0 1px var(--st-bl); font-size:12.5px; line-height:1.75;
  color:var(--warn-ink); }
.warnbox b { display:block; font-size:9px; font-weight:700; letter-spacing:.09em;
  text-transform:uppercase; color:var(--st-bl); margin-bottom:6px; }
.ctx { margin:0; padding:0; list-style:none; }
.ctx li { position:relative; padding:6px 0 6px 15px; font-size:12.5px; line-height:1.7;
  color:var(--ink2); }
.ctx li + li { border-top:1px solid var(--hairline); }
.ctx li:before { content:""; position:absolute; left:0; top:15px; width:5px; height:5px;
  border-radius:50%; background:var(--dot); }
.mod.empty { box-shadow:var(--ring1); background:var(--panel2); }

/* 草稿模组: 绿 = 成了 / 送得出去。⛔ 不给橙, 橙留给「需要你」 */
.mod.work { box-shadow:inset 0 1px 0 var(--glasstop),
  inset 0 0 0 1px var(--dn-ring), var(--glassdrop); }
.mod.work .mod-head { border-bottom-color:var(--dn-ring); }
.mod.work .mod-head h4 { color:var(--st-dn); }
.mod.work.none { box-shadow:var(--ring1); background:var(--panel2); }
.mod.work.none .mod-head h4 { color:var(--muted); }
.work-body { display:flex; flex-direction:column; min-height:0; }
.edited { display:none; font-size:9px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--st-dn); background:var(--st-dn-bg); padding:2px 8px; border-radius:999px;
  box-shadow:inset 0 0 0 1px var(--go-ring); margin-left:8px; }
.edited.on { display:inline-block; }
.dnote { margin:0 0 12px; font-size:11.5px; line-height:1.75; color:var(--muted); }
textarea { display:block; width:100%; flex:1 1 auto; min-height:110px; color:var(--ink);
  background:var(--sunk); border:0; border-radius:10px; padding:13px 15px; resize:none;
  box-shadow:var(--ring1);
  font-family:var(--font); font-size:14px; line-height:1.9;
  transition:box-shadow .16s var(--ease); }
textarea:focus { outline:none; box-shadow:inset 0 0 0 1px var(--go-ring); }
textarea.dirty { box-shadow:inset 0 0 0 1px var(--go-ring); }
.bar2 { flex:none; display:flex; align-items:center; gap:12px; margin-top:11px; }
.cnt { font-size:10px; color:var(--faint); font-variant-numeric:tabular-nums; }
.go { margin-left:auto; color:var(--go-ink); font-size:12px; font-weight:600; cursor:pointer;
  border:0; border-radius:999px; padding:8px 16px;
  background:var(--go-fill);
  box-shadow:inset 0 0 0 1px var(--go-ring);
  transition:background .16s var(--ease), transform .16s var(--ease); }
.go:hover { background:var(--go-fill-hi); }
.go:active { transform:translateY(1px); }
.go.copy { color:var(--ink2); background:var(--panel);
  box-shadow:var(--ring1); }
.go.copy:hover { background:var(--hover); color:var(--ink); }
.gohint { flex:none; margin:10px 0 0; font-size:10.5px; line-height:1.75; color:var(--faint); }

.seg { display:inline-flex; margin-left:12px; padding:2px; border-radius:999px;
  background:var(--panel2); box-shadow:var(--ring1); }
.seg button { font:inherit; font-size:10px; font-weight:600; color:var(--muted); cursor:pointer;
  background:none; border:0; border-radius:999px; padding:3px 9px;
  transition:background .16s var(--ease), color .16s var(--ease); }
.seg button:hover { color:var(--ink); }
.seg button[data-on="1"] { background:var(--glass-sel); color:var(--ink); box-shadow:var(--ring1); }

@media (prefers-reduced-motion:reduce) {
  *, *:before, *:after { transition:none !important; animation:none !important; }
  .go:active { transform:none; }
}

/* ---- 模板追加: 通用色调 class, 让 JSON 里的 tone 值对得上 Deck 的状态色家族 ---- */
.tone-accent { background:var(--accent-fill); box-shadow:inset 0 0 0 1px var(--accent-ring); color:var(--accent-ink); }
.tone-wf { background:var(--st-wf-bg); box-shadow:inset 0 0 0 1px var(--st-wf); color:var(--st-wf); }
.tone-ns { background:var(--st-ns-bg); box-shadow:inset 0 0 0 1px var(--line); color:var(--st-ns); }
.tone-bl { background:var(--st-bl-bg); box-shadow:inset 0 0 0 1px var(--st-bl); color:var(--st-bl); }
.tone-dn { background:var(--st-dn-bg); box-shadow:inset 0 0 0 1px var(--go-ring); color:var(--st-dn); }
.item.tone-accent-rail.is-on { box-shadow:inset 0 1px 0 var(--glasstop), inset 0 0 0 1px var(--accent-ring), var(--glassdrop); }
.empty-hint { padding:40px 22px; color:var(--muted); font-size:12.5px; line-height:1.9; }
</style>
</head>
<body>
<!--
  ============================================================================
  分诊台模板 (Triage Board Template)
  ============================================================================

  一张「左边列清单, 右边一屏做事」的本机工作台。离线单档, 不连任何外部服务,
  没有 build step, 双击就开。

  ── 怎么用 ────────────────────────────────────────────────────────────────
  1. 复制这个档, 改名。
  2. 只改 <script id="board-data"> 里那一块 JSON。其他一律不要动。
  3. 存档, 用浏览器打开。

  ── 设计法源 (⛔ 要改外观先读这段) ────────────────────────────────────────
  颜色 · 玻璃质感 · 圆角 · 缓动全部抄自 Jia Wei 的 Command Deck:
      07_Breakthrough/Control-Tower-Dashboard/index.html 的 :root
  ⛔ 不要从零发明配色, 也不要套外来的 design skill。已经试过四轮 (minimal /
     Carbon / 稽核表), 全被驳回, 因为这台机上早就有正本。要改先去读那份 :root。

  深色 = Deck 原值逐字抄。浅色 = Apple 材质语言 (#F5F5F7 底 · 白色半透明
  vibrancy · #1D1D1F 文字 · 系统色)。两套共用同一组 token 名字, 右上角可切换,
  选择记在 localStorage。
  ⚠️ 深色的 token 在 CSS 里写了两次 (系统深色 + 手动深色)。少写一次, toggle
     就会有一边推不动。

  ⛔ Deck 自己 CSS 注释里立的规矩, 这里照守: **橙 = 下一个 / 需要你**。
     整个画面只准 P1 那颗药丸跟「球在你」是橙的。多一个常驻橙, 这个信号就废了。
     其他一律走状态色家族: wf 琥珀 = 等对方 · ns 灰 = 静置 · bl 红 = 读不到
     · dn 绿 = 送得出去 (动作钮)。

  ── JSON 栏位 ─────────────────────────────────────────────────────────────
  顶层
    title      顶栏标题
    tag        标题旁那个小标签, 可省
    meta       顶栏的 k/v 对, 加 "hot": true 会染成强调色
    stamp      顶栏最右边那行小字
    notice     顶部那条可收合的警示 row。设成 null 整条消失。
               { badge, title, lead, items[], footer }
               lead 收起来的时候仍然看得见, 所以别把重点藏进 items。
    bands      分段。每段 { label, rows[] }
    legend     左栏底部那块小字, 吃 HTML

  row
    id         唯一字串, 拿来配对左右两栏
    name       显示名
    emoji      从 name 里拆出来单独占一格。⛔ 留在 name 里会让每行名字起点对不齐。
    tag        { label, tone } tone = accent | wf | ns | bl | dn
    dim        true = 无待办, 那一行会变矮变淡
    flag       true = 名字后面长一颗红点, 表示这条有读不到的资料
    num / date 右上角数字与日期
    snippet    一行提示。tone 是 accent 的 row 会把它染成强调色。
    chip       { label, tone } 左栏底部那颗小药丸
    gauges     右栏标题下那排仪表格 [{ k, v, hot, grow }]
    blocks     右栏的内容区块, 依序渲染 (见下)

  block
    { kind: "prose", title, text, warn?: { title, text } }
    { kind: "list",  title, items: [] }
    { kind: "draft", title, note, text,
      action: { type: "link" | "copy", label, label_dirty, href_prefix?, hint } }

  ⚠️ 版面规则: draft 那一块固定去右半栏并撑满高度, 其他 block 依序叠在左半栏。
     整页锁死不滚 (overflow:hidden), 内容太长时只有该区块内部滚。
     所以 blocks 建议最多三块, 其中一块是 draft。

  ⛔ 动作钮只组 URL, 不替人送出。href_prefix 后面接 encodeURIComponent(当下框里
     的文字), 而且是**按下那一刻**才组, 所以带走的一定是使用者改完的版本。
-->

<header class="bar">
  <h1 id="bar-title"></h1><span class="tag" id="bar-tag"></span>
  <span id="bar-meta"></span>
  <span class="sp"></span>
  <span class="kv" id="bar-stamp"></span>
  <span class="seg" id="seg">
    <button data-t="system">系统</button><button data-t="light">浅</button><button data-t="dark">深</button>
  </span>
</header>

<section class="gapstrip" id="notice"></section>

<div class="shell">
  <nav class="list"></nav>
  <main class="stage"></main>
</div>

<script>
/* 主题: 预设跟系统, 手动选了就记住。
   ⛔ 深色的 token 在 CSS 里写了两次 (系统深色 + 手动深色); 少写一次这里会推不动。 */
(function () {
  const seg = document.getElementById('seg');
  const paint = v => {
    if (v === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
    [...seg.children].forEach(b => b.dataset.on = (b.dataset.t === v) ? '1' : '0');
    try { localStorage.setItem('triage-theme', v); } catch (e) {}
  };
  let saved = 'system';
  try { saved = localStorage.getItem('triage-theme') || 'system'; } catch (e) {}
  paint(saved);
  seg.addEventListener('click', ev => { if (ev.target.dataset.t) paint(ev.target.dataset.t); });
})();

const DATA = JSON.parse(document.getElementById('board-data').textContent);
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ---- 顶栏 ---- */
document.getElementById('bar-title').textContent = DATA.title || '';
document.getElementById('bar-tag').textContent = DATA.tag || '';
document.getElementById('bar-meta').innerHTML =
  (DATA.meta || []).map(m =>
    `<span class="kv${m.hot ? ' hot' : ''}">${esc(m.k)} <b>${esc(m.v)}</b></span>`).join('');
document.getElementById('bar-stamp').textContent = DATA.stamp || '';

/* ---- 警示条。⛔ 收起来也要看得见件数与 lead, 不然就变成静默漏掉 ---- */
const strip = document.getElementById('notice');
if (!DATA.notice) { strip.remove(); }
else {
  const n = DATA.notice;
  strip.innerHTML =
    `<button class="gaphead" id="notice-toggle">
       <span class="mark">${esc(n.badge || '!')}</span>
       <h4>${esc(n.title)}</h4>
       <span class="lead">${esc(n.lead || '')}</span>
       <span class="chev">展开</span>
     </button>
     <div class="gapbody">
       <ul>${(n.items || []).map(i => `<li>${esc(i)}</li>`).join('')}</ul>
       ${n.footer ? `<p>${n.footer}</p>` : ''}
     </div>`;
  document.getElementById('notice-toggle').addEventListener('click', () => {
    strip.classList.toggle('open');
    strip.querySelector('.chev').textContent =
      strip.classList.contains('open') ? '收起' : '展开';
  });
}

/* ---- 左栏与右栏 ---- */
const listEl = document.querySelector('.list');
const stageEl = document.querySelector('.stage');
let railHTML = '', stageHTML = '';

(DATA.bands || []).forEach(band => {
  const rows = band.rows || [];
  if (!rows.length) return;
  railHTML += `<div class="sect"><span>${esc(band.label)}</span><i>${rows.length}</i></div>`;
  rows.forEach(r => {
    const tone = (r.tag && r.tag.tone) || 'ns';
    railHTML +=
      `<button class="item${r.dim ? ' dim' : ''}${tone === 'accent' ? ' tone-accent-rail p1' : ''}" data-id="${esc(r.id)}">
         <span class="i-head">
           ${r.tag ? `<span class="pill tone-${esc(tone)}">${esc(r.tag.label)}</span>` : ''}
           <span class="i-emo">${esc(r.emoji || '')}</span>
           <span class="i-name">${esc(r.name)}</span>
           ${r.flag ? '<span class="sq"></span>' : ''}
           ${r.num != null ? `<span class="i-num">${esc(r.num)}</span>` : ''}
         </span>
         ${r.snippet ? `<span class="snip">${esc(r.snippet)}</span>` : ''}
         <span class="i-foot">
           ${r.chip ? `<span class="ball ${r.chip.tone === 'accent' ? 'bme' : 'bthem'}">${esc(r.chip.label)}</span>` : ''}
           ${r.date ? `<span class="i-date">${esc(r.date)}</span>` : ''}
         </span>
       </button>`;

    const left = [], right = [];
    (r.blocks || []).forEach(b => {
      if (b.kind === 'prose') {
        left.push(
          `<section class="mod glass">
             <div class="mod-head"><h4>${esc(b.title)}</h4></div>
             <div class="mod-body scroll">
               <p class="prose">${esc(b.text)}</p>
               ${b.warn ? `<div class="warnbox"><b>${esc(b.warn.title)}</b>${esc(b.warn.text)}</div>` : ''}
             </div>
           </section>`);
      } else if (b.kind === 'list') {
        const items = b.items || [];
        left.push(
          `<section class="mod glass${items.length ? '' : ' empty'}">
             <div class="mod-head"><h4>${esc(b.title)}</h4>
               <span class="mod-c">${items.length} 条</span></div>
             <div class="mod-body scroll">
               <ul class="ctx">${items.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
             </div>
           </section>`);
      } else if (b.kind === 'draft') {
        const a = b.action || {};
        const has = !!b.text;
        right.push(
          `<section class="mod glass work${has ? '' : ' none'}">
             <div class="mod-head"><h4>${esc(b.title)}</h4>
               ${has ? '<span class="mod-c">可直接编辑</span>' : ''}
               ${has ? `<span class="edited" id="e-${esc(r.id)}">已改</span>` : ''}</div>
             <div class="mod-body work-body">
               ${b.note ? `<p class="dnote">${esc(b.note)}</p>` : ''}
               ${has ? `
                 <textarea id="t-${esc(r.id)}" spellcheck="false" data-orig="${esc(b.text)}">${esc(b.text)}</textarea>
                 <div class="bar2">
                   <span class="cnt"><span id="c-${esc(r.id)}">0</span> 字</span>
                   <button class="go${a.type === 'copy' ? ' copy' : ''}" data-for="${esc(r.id)}"
                     data-a="${esc(a.label || '执行')}" data-b="${esc(a.label_dirty || a.label || '执行')}"
                     ${a.href_prefix ? `data-href="${esc(a.href_prefix)}"` : ''}>${esc(a.label || '执行')}</button>
                 </div>
                 ${a.hint ? `<p class="gohint">${esc(a.hint)}</p>` : ''}`
               : '<p class="dnote">这一条没有预写草稿。</p>'}
             </div>
           </section>`);
      }
    });

    stageHTML +=
      `<article class="panel" id="p-${esc(r.id)}">
         <header class="phead glass">
           <div class="ph-l">
             ${r.tag ? `<span class="pill big tone-${esc(tone)}">${esc(r.tag.label)}</span>` : ''}
             <h2 class="ptitle">${esc(r.emoji || '')} ${esc(r.name)}</h2>
           </div>
           <div class="gauges">
             ${(r.gauges || []).map(g =>
               `<div class="gauge${g.grow ? ' grow' : ''}"><span>${esc(g.k)}</span>
                  <b${g.hot ? ' class="hot"' : ''}>${esc(g.v)}</b></div>`).join('')}
           </div>
         </header>
         <div class="grid">
           <div class="col">${left.join('')}</div>
           <div class="col">${right.join('')}</div>
         </div>
       </article>`;
  });
});

if (DATA.legend) railHTML += `<div class="legend">${DATA.legend}</div>`;
listEl.innerHTML = railHTML;
stageEl.innerHTML = stageHTML || '<div class="empty-hint">board-data 里没有任何 row。</div>';

/* ---- 选取 ---- */
const items = [...document.querySelectorAll('.item')];
const panels = [...document.querySelectorAll('.panel')];
function show(id) {
  items.forEach(b => b.classList.toggle('is-on', b.dataset.id === id));
  panels.forEach(p => p.classList.toggle('is-on', p.id === 'p-' + id));
}
items.forEach(b => b.addEventListener('click', () => show(b.dataset.id)));
if (items.length) show(items[0].dataset.id);

/* ---- 草稿: 改过就换样子, 连按钮的字都换掉 ---- */
document.querySelectorAll('textarea').forEach(t => {
  const id = t.id.slice(2);
  const cnt = document.getElementById('c-' + id);
  const tag = document.getElementById('e-' + id);
  const btn = document.querySelector('.go[data-for="' + id + '"]');
  const tick = () => {
    const dirty = t.value !== t.dataset.orig;
    if (cnt) cnt.textContent = t.value.length;
    t.classList.toggle('dirty', dirty);
    if (tag) tag.classList.toggle('on', dirty);
    if (btn) btn.textContent = dirty ? btn.dataset.b : btn.dataset.a;
  };
  t.addEventListener('input', tick); tick();
});

/* ---- 动作: URL 在按下那一刻才组, 带走的一定是当下框里那个版本 ---- */
function fire(btn) {
  const t = document.getElementById('t-' + btn.dataset.for);
  if (!t) return;
  const text = t.value;
  if (!btn.dataset.href) {
    const back = btn.textContent;
    navigator.clipboard.writeText(text).then(() => {
      btn.textContent = '已复制 ✓';
      setTimeout(() => btn.textContent = back, 1800);
    });
    return;
  }
  window.location.href = btn.dataset.href + encodeURIComponent(text);
}
document.querySelectorAll('.go').forEach(b => b.addEventListener('click', () => fire(b)));

document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'TEXTAREA') return;
  const i = items.findIndex(b => b.classList.contains('is-on'));
  if (['j','k','ArrowDown','ArrowUp'].includes(ev.key)) {
    ev.preventDefault();
    const down = (ev.key === 'j' || ev.key === 'ArrowDown');
    const n = (i + (down ? 1 : -1) + items.length) % items.length;
    show(items[n].dataset.id);
    items[n].scrollIntoView({ block: 'nearest' });
  } else if (ev.key === 'Enter') {
    const btn = panels.find(p => p.classList.contains('is-on'))?.querySelector('.go');
    if (btn) { ev.preventDefault(); fire(btn); }
  }
});
</script>
</body></html>
